[project]
name = "paradox-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.21.0",
    "alembic>=1.16.4",
    "fastapi>=0.161.1",
    "openrouter>=1.2.15",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.41",
    "sqlmodel>=0.0.24",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.12.4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.uv]
# Security floors for transitive dependencies, including test tooling.
constraint-dependencies = [
    "anyio>=4.14.2",
    "certifi>=2026.10.19",
    "idna>=3.15",
    "mako>=1.3.12",
    "pygments>=2.20.0",
    "starlette>=1.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paradox_engine"]

[tool.ruff]
target-version = "py312"
line-length = 88
