[project]
name = "paradox-terminal"
version = "0.1.0"
description = "Discord bot for Paradox Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord>=2.3.2",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "ruff>=0.12.5",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
# Security floors for the Discord and HTTP clients' transitive dependencies.
constraint-dependencies = [
    "aiohttp>=3.14.4",
    "anyio>=4.14.2",
    "certifi>=2026.10.19",
    "idna>=3.15",
    "pygments>=2.20.0",
]
